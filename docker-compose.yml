services:
  # Caddy Proxy Server
  caddy:
    image: caddy:2-alpine
    container_name: mohe-caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mohe-network
      - mohespring_mohe-network
      - proxy_network
      - mohebatch_mohe-network
    depends_on:
      - mohe-frontend
      - mohe-admin
      - mohe-store

  # React Frontend
  mohe-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mohe-react-app
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mohe-network
    expose:
      - "80"

  # Admin Dashboard
  mohe-admin:
    build:
      context: ../MoheAdmin
      dockerfile: Dockerfile
    container_name: mohe-admin-app
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mohe-network
    expose:
      - "80"

  # Store (LayerLab)
  mohe-store:
    build:
      context: ../MoheStore
      dockerfile: Dockerfile
    container_name: mohe-store-app
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - mohe-network
    expose:
      - "80"

networks:
  mohe-network:
    driver: bridge
  mohespring_mohe-network:
    external: true
  proxy_network:
    external: true
  mohebatch_mohe-network:
    external: true

volumes:
  caddy_data:
  caddy_config:
