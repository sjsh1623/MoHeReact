<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F1115" />
  <title>Andrew Studio</title>
  <meta name="description" content="Andrew Studio — Withy 가계부와 Routinee 습관 관리. 부부와 가족, 그리고 매일을 더 단단하게." />
  <link rel="icon" href="/favicon.ico" />
  <style>
    :root {
      --bg: #0F1115;
      --surface: #1A1D24;
      --surface-2: #232730;
      --line: #2C3038;
      --ink: #F2F4F7;
      --text-2: #C5CCD4;
      --text-3: #8A929D;
      --accent-withy: #A6E635;
      --accent-routinee: #6E5CE6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo",
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.55;
    }
    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    header { padding-bottom: 40px; }
    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: var(--text-3);
      text-transform: uppercase;
    }
    .brand .dot {
      width: 6px; height: 6px; border-radius: 999px;
      background: var(--accent-withy);
      transform: translateY(-1px);
    }
    h1 {
      margin: 18px 0 12px;
      font-size: clamp(28px, 5.4vw, 40px);
      letter-spacing: -0.8px;
      line-height: 1.18;
      font-weight: 800;
    }
    .lede {
      max-width: 580px;
      margin: 0;
      font-size: 15px;
      color: var(--text-2);
    }
    .grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      main { padding: 40px 20px 64px; }
    }
    a.card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 24px;
      padding: 24px;
      min-height: 220px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: inherit;
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    a.card:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.18);
      background: var(--surface-2);
    }
    a.card:focus-visible {
      outline: 2px solid var(--accent-withy);
      outline-offset: 3px;
    }
    .card .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .card .badge {
      width: 44px; height: 44px; border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 18px; letter-spacing: -0.4px;
      color: #0F1115;
      flex-shrink: 0;
    }
    .card.withy .badge { background: var(--accent-withy); }
    .card.routinee .badge { background: var(--accent-routinee); color: #fff; }
    .card h2 {
      margin: 0;
      font-size: 22px; letter-spacing: -0.4px; font-weight: 800;
    }
    .card p {
      margin: 0;
      font-size: 14px; color: var(--text-2);
    }
    .cta {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 700;
      color: var(--ink);
    }
    .cta .arrow {
      transition: transform .18s ease;
    }
    a.card:hover .cta .arrow { transform: translateX(3px); }

    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--text-3);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    footer a {
      color: var(--text-2);
      text-decoration: none;
    }
    footer a:hover { color: var(--ink); }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><span class="dot"></span>Andrew Studio</div>
      <h1>매일을 더 단단하게,<br/>두 가지 도구.</h1>
      <p class="lede">
        Andrew Studio가 만드는 일상 도구입니다.
        가계부 한 권을 부부가 같이 쓰는 <strong>Withy</strong>,
        매일을 가볍게 정리하는 <strong>Routinee</strong>.
      </p>
    </header>

    <section class="grid" aria-label="Andrew Studio 앱 목록">
      <a class="card withy" href="/withy" aria-label="Withy 열기">
        <div class="row">
          <span class="badge" aria-hidden="true">W</span>
          <h2>Withy</h2>
        </div>
        <p>부부가 함께 쓰는 가계부와 캘린더. 둘이 같이 보는 한 권의 가계부, 한 장의 일정표.</p>
        <span class="cta">앱 열기 <span class="arrow" aria-hidden="true">→</span></span>
      </a>

      <a class="card routinee" href="/routinee" aria-label="Routinee 열기">
        <div class="row">
          <span class="badge" aria-hidden="true">R</span>
          <h2>Routinee</h2>
        </div>
        <p>매일 반복하는 작은 습관을 가볍게 적고, 한 주의 흐름을 한눈에 확인합니다.</p>
        <span class="cta">앱 열기 <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </section>

    <footer>
      <span>© Andrew Studio</span>
      <span>
        <a href="mailto:hello@mohe.app">hello@mohe.app</a>
      </span>
    </footer>
  </main>
</body>
</html>
