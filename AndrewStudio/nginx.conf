server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tiny static landing page — no SPA fallback needed (it's a single
    # page). Caddy 301s /withy and /routinee on its own, but if a request
    # for them somehow lands here (fallback path), respond with 404 so the
    # request can bubble back up the proxy chain in a debuggable way
    # rather than silently serving the studio page under those URLs.
    location = / {
        try_files /index.html =404;
    }

    location = /favicon.ico {
        try_files /favicon.ico =204;
        access_log off;
        log_not_found off;
    }

    # Cache: HTML never, static assets aggressive (none right now, but
    # ready for when we add a logo / og-image).
    location ~* \.(?:html|htm)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location ~* \.(?:png|jpg|jpeg|webp|svg|css|js|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Anything else → 404. Apex catch-all is the studio's index alone.
    location / {
        return 404;
    }
}
